<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linn Point · Attendance</title><link rel="stylesheet" href="/style.css"><style>.portal-page .sidebar-logo{display:block;width:175px;max-height:58px;height:auto;object-fit:contain;margin:0 auto 28px}.portal-page .sidebar{padding-top:22px}.portal-page .content-logo{display:none!important}.portal-page .nav a.active{background:#dff3f5;color:#123b52}.portal-page .page-head{align-items:flex-start}.edit-panel{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.edit-panel.open{display:flex}.edit-card{width:min(620px,100%);background:#fff;border-radius:18px;padding:26px;box-shadow:0 25px 70px rgba(15,23,42,.25)}.edit-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}@media(max-width:760px){.portal-page .sidebar-logo{width:150px}}</style></head><body class="portal-page"><div class="app-layout"><aside class="sidebar" id="sidebar"><img class="sidebar-logo" src="https://linnpoint.com/wp-content/uploads/2020/09/Final-LINNPOINT_LOGO-033.webp" alt="Linn Point"><nav class="nav"><a href="/admin.html">📊 <span>Dashboard</span></a><a href="/admin-employees.html">👥 <span>Employees</span></a><a href="/admin-work-report.html">📝 <span>Work Reports</span></a><a href="/admin-leaves.html">📅 <span>Leave Requests</span></a><a class="active" href="/admin-attendance.html">🕒 <span>Attendance</span></a><a href="/admin-monthly.html">📈 <span>Monthly Reports</span></a></nav><div class="side-bottom"><div class="user-mini"><strong>Administrator</strong><span>Attendance management</span></div><button class="logout-link" type="button" onclick="logout()">↪ Logout</button></div></aside><main class="content"><div class="content-inner"><header class="page-head"><div><button class="mobile-menu" type="button" onclick="toggleSidebar()">☰</button><span class="eyebrow">LINN POINT · ADMIN PORTAL</span><h1>Attendance</h1><p class="muted">Review, edit and export attendance records.</p></div><button type="button" onclick="csv()">Export CSV</button></header><section class="card"><div class="toolbar"><div><label>Month</label><input type="month" id="month"></div><div><label>Employee</label><select id="employee"><option value="">All employees</option></select></div><button type="button" onclick="load()">Apply filters</button></div><div id="table" class="tablewrap"></div></section></div></main></div><div class="edit-panel" id="panel"><div class="edit-card"><h2>Edit attendance</h2><p class="muted">Admin changes are saved immediately.</p><div class="formgrid"><div class="field"><label>Check-in</label><input id="ci" type="datetime-local"></div><div class="field"><label>Lunch start</label><input id="ls" type="datetime-local"></div><div class="field"><label>Lunch end</label><input id="le" type="datetime-local"></div><div class="field"><label>Check-out</label><input id="co" type="datetime-local"></div></div><div class="edit-actions"><button class="ghost" type="button" onclick="closeEdit()">Cancel</button><button type="button" onclick="saveEdit()">Save changes</button></div></div></div><script src="/common.js"></script><script>if(!token||role!=='admin')location.href='/';let rows=[],editing=null;function toggleSidebar(){sidebar.classList.toggle('open')}function toLocal(v){if(!v)return '';const d=new Date(v);const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}function fromLocal(v){return v?new Date(v).toISOString():null}function openEdit(a){editing=a;ci.value=toLocal(a.check_in);ls.value=toLocal(a.lunch_start);le.value=toLocal(a.lunch_end);co.value=toLocal(a.check_out);panel.classList.add('open')}function closeEdit(){panel.classList.remove('open');editing=null}async function saveEdit(){try{await api('/admin/attendance/'+editing.id,{method:'PATCH',body:JSON.stringify({check_in:fromLocal(ci.value),lunch_start:fromLocal(ls.value),lunch_end:fromLocal(le.value),check_out:fromLocal(co.value)})});closeEdit();load()}catch(e){alert(e.message)}}async function load(){try{const d=await api('/admin/dashboard');employee.innerHTML='<option value="">All employees</option>'+d.employees.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('');const q=new URLSearchParams();if(month.value)q.set('month',month.value);if(employee.value)q.set('employee_id',employee.value);rows=await api('/admin/attendance?'+q);table.innerHTML=rows.length?'<table><thead><tr><th>Date</th><th>Employee</th><th>Phone</th><th>Check-in</th><th>Lunch</th><th>Check-out</th><th>Working</th><th>OT</th><th>Action</th></tr></thead><tbody>'+rows.map(a=>`<tr><td>${a.date}</td><td><strong>${esc(a.name)}</strong></td><td>${esc(a.phone)||'—'}</td><td>${time(a.check_in)}</td><td>${fmt(a.lunch_minutes)}</td><td>${a.check_out?time(a.check_out):'<span class="badge live">Active</span>'}</td><td>${fmt(a.working_minutes)}</td><td class="accent">${fmt(a.overtime_minutes)}</td><td><button class="small" type="button" onclick='openEdit(${JSON.stringify(a)})'>Edit</button></td></tr>`).join('')+'</tbody></table>':'<div class="empty">No attendance records found.</div>'}catch(e){alert(e.message)}}function csv(){if(!rows.length)return alert('No records to export');const head=['Date','Employee','Email','Phone','Check-in','Lunch Start','Lunch End','Check-out','Office Minutes','Lunch Minutes','Working Minutes','Overtime Minutes'];const body=rows.map(a=>[a.date,a.name,a.email,a.phone||'',a.check_in,a.lunch_start||'',a.lunch_end||'',a.check_out||'',a.office_minutes,a.lunch_minutes,a.working_minutes,a.overtime_minutes]);const text=[head,...body].map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');const blob=new Blob([text],{type:'text/csv'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='attendance-report.csv';a.click();URL.revokeObjectURL(u)}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}load();setInterval(load,30000);</script></body></html>
