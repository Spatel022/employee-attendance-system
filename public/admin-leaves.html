<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linn Point · Leave Requests</title><link rel="stylesheet" href="/style.css"><style>.portal-page .sidebar-logo{display:block;width:175px;max-height:58px;height:auto;object-fit:contain;margin:0 auto 28px}.portal-page .sidebar{padding-top:22px}.portal-page .content-logo{display:none!important}.portal-page .nav a.active{background:#dff3f5;color:#123b52}.portal-page .page-head{align-items:flex-start}@media(max-width:760px){.portal-page .sidebar-logo{width:150px}}</style></head><body class="portal-page"><div class="app-layout"><aside class="sidebar" id="sidebar"><img class="sidebar-logo" src="/logo-dark.svg" alt="Linn Point"><nav class="nav"><a href="/admin.html">📊 <span>Dashboard</span></a><a href="/admin-employees.html">👥 <span>Employees</span></a><a href="/admin-work-report.html">📝 <span>Work Reports</span></a><a class="active" href="/admin-leaves.html">📅 <span>Leave Requests</span></a><a href="/admin-attendance.html">🕒 <span>Attendance</span></a><a href="/admin-monthly.html">📈 <span>Monthly Reports</span></a></nav><div class="side-bottom"><div class="user-mini"><strong>Administrator</strong><span>Attendance management</span></div><button class="logout-link" type="button" onclick="logout()">↪ Logout</button></div></aside><main class="content"><div class="content-inner"><header class="page-head"><div><button class="mobile-menu" type="button" onclick="toggleSidebar()">☰</button><span class="eyebrow">LINN POINT · ADMIN PORTAL</span><h1>Leave Requests</h1><p class="muted">Review and manage employee leave applications.</p></div></header><section class="card"><div class="section-head"><div><h2>Requests</h2><p>Approve, reject or reopen a request with an optional note.</p></div><button class="ghost" type="button" onclick="load()">Refresh</button></div><div id="table" class="tablewrap"></div></section></div></main></div><script src="/common.js"></script><script>if(!token||role!=='admin')location.href='/';function toggleSidebar(){sidebar.classList.toggle('open')}async function review(id,status,currentNote){const note=prompt(status==='approved'?'Admin note (optional)':'Reason / admin note (optional)',currentNote||'');if(note===null)return;try{await api('/admin/leaves/'+id,{method:'PATCH',body:JSON.stringify({status,admin_note:note})});load()}catch(e){alert(e.message)}}async function load(){try{const data=await api('/admin/leaves');table.innerHTML=data.length?'<table><thead><tr><th>Employee</th><th>Date</th><th>Type</th><th>Reason</th><th>Status</th><th>Action</th></tr></thead><tbody>'+data.map(l=>`<tr><td><strong>${esc(l.employee_name)}</strong><br><small>${esc(l.employee_email)}</small></td><td>${l.start_date}${l.end_date!==l.start_date?' → '+l.end_date:''}</td><td>${l.type==='half'?'Half Day · '+l.half_day:'Full Day'}</td><td>${esc(l.reason)}</td><td><span class="badge ${l.status==='approved'?'approved':l.status==='rejected'?'rejected':'pending'}">${l.status}</span></td><td>${l.status==='pending'?`<button class="small" type="button" onclick="review(${l.id},'approved','')">Approve</button> <button class="small danger" type="button" onclick="review(${l.id},'rejected','')">Reject</button>`:`<button class="small" type="button" onclick="review(${l.id},'pending',${JSON.stringify(l.admin_note||'')})">Reopen</button>`}</td></tr>`).join('')+'</tbody></table>':'<div class="empty">No leave requests found.</div>'}catch(e){alert(e.message)}}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}load();setInterval(load,30000);</script></body></html>
