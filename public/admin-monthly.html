<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linn Point · Monthly Reports</title><link rel="stylesheet" href="/style.css"><style>.portal-page .sidebar-logo{display:block;width:175px;max-height:58px;height:auto;object-fit:contain;margin:0 auto 28px}.portal-page .sidebar{padding-top:22px}.portal-page .content-logo{display:none!important}.portal-page .nav a.active{background:#dff3f5;color:#123b52}.page-head{align-items:flex-start}.toolbar{display:flex;align-items:end;gap:12px;flex-wrap:wrap}.toolbar label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.report-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin:18px 0}.report-box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}.report-box small{display:block;color:var(--muted);font-size:12px;margin-bottom:8px}.report-box strong{font-size:24px}.employee-card{display:flex;align-items:center;gap:15px}.avatar{width:48px;height:48px;border-radius:14px;background:#eff6ff;display:grid;place-items:center;font-weight:800;color:#1d4ed8}.summary-line{color:var(--muted);font-size:13px}.status-work{color:#067647;font-weight:700}.status-leave{color:#b54708;font-weight:700}.status-absent{color:#b42318;font-weight:700}.status-weekend{color:#667085;font-weight:700}@media(max-width:1050px){.report-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.portal-page .sidebar-logo{width:150px}.report-grid{grid-template-columns:1fr 1fr}.report-box strong{font-size:20px}}</style></head><body class="portal-page"><div class="app-layout"><aside class="sidebar" id="sidebar"><img class="sidebar-logo" src="https://linnpoint.com/wp-content/uploads/2020/09/Final-LINNPOINT_LOGO-033.webp" alt="Linn Point"><nav class="nav"><a href="/admin.html">📊 <span>Dashboard</span></a><a href="/admin-employees.html">👥 <span>Employees</span></a><a href="/admin-leaves.html">📅 <span>Leave Requests</span></a><a href="/admin-attendance.html">🕒 <span>Attendance</span></a><a class="active" href="/admin-monthly.html">📈 <span>Monthly Reports</span></a></nav><div class="side-bottom"><div class="user-mini"><strong>Administrator</strong><span>Attendance management</span></div><button class="logout-link" onclick="logout()">↪ Logout</button></div></aside><main class="content"><div class="content-inner"><header class="page-head"><div><button class="mobile-menu" onclick="toggleSidebar()">☰</button><span class="eyebrow">LINN POINT · ADMIN PORTAL</span><h1>Monthly Reports</h1><p class="muted">Search an employee and review their complete monthly attendance.</p></div></header><section class="card"><div class="toolbar"><div><label>Month</label><input id="month" type="month"></div><div><label>Employee</label><select id="employee" onchange="loadReport()"><option value="">Select employee</option></select></div><button onclick="loadReport()">View report</button><button class="ghost" onclick="exportReport()">Export CSV</button></div></section><div id="employeeInfo"></div><div id="stats" class="report-grid"></div><section class="card" id="reportCard" style="display:none"><div class="section-head"><div><h2 id="reportTitle">Daily attendance</h2><p>Work, leave, absence and time totals for the selected month.</p></div></div><div id="table" class="tablewrap"></div></section></div></main></div><script src="/common.js"></script><script>if(!token||role!=='admin')location.href='/';let employees=[],attendance=[],leaves=[];const now=new Date();month.value=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;function toggleSidebar(){sidebar.classList.toggle('open')}function daysInMonth(y,m){return new Date(y,m,0).getDate()}function dateKey(y,m,d){return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`}function getLeave(date){return leaves.find(l=>l.status==='approved'&&l.start_date<=date&&l.end_date>=date)}async function init(){try{const d=await api('/admin/dashboard');employees=d.employees;employee.innerHTML='<option value="">Select employee</option>'+employees.map(e=>`<option value="${e.id}">${esc(e.name)} · ${esc(e.email)}</option>`).join('')}catch(e){alert(e.message)}}async function loadReport(){if(!employee.value)return;try{const [a,l]=await Promise.all([api('/admin/attendance?month='+month.value+'&employee_id='+employee.value),api('/admin/leaves?employee_id='+employee.value)]);attendance=a;leaves=l;const emp=employees.find(e=>String(e.id)===String(employee.value));const [y,m]=month.value.split('-').map(Number),days=daysInMonth(y,m),byDate=new Map(a.map(x=>[x.date,x]));let worked=0,leave=0,half=0,absent=0,working=0,ot=0,weekends=0;let rows=[];for(let d=1;d<=days;d++){const date=dateKey(y,m,d),dow=new Date(y,m-1,d).getDay(),rec=byDate.get(date),lv=getLeave(date);let status,detail;if(rec){status='Worked';detail=fmt(rec.working_minutes);worked++;working+=rec.working_minutes||0;ot+=rec.overtime_minutes||0}else if(lv){if(lv.type==='half'){status='Half Day Leave';detail=lv.half_day;half++}else{status='On Leave';detail=lv.reason;leave++}}else if(dow===0||dow===6){status='Weekend';detail='—';weekends++}else{status='Absent / Not marked';detail='No attendance';absent++}rows.push({date,dow,status,detail,rec,lv})}employeeInfo.innerHTML=`<section class="card"><div class="employee-card"><div class="avatar">${esc(emp.name).split(' ').map(x=>x[0]).slice(0,2).join('')}</div><div><h2>${esc(emp.name)}</h2><div class="summary-line">${esc(emp.email)} · ${esc(emp.phone||'No phone')}</div></div></div></section>`;stats.innerHTML=`<div class="report-box"><small>Days Worked</small><strong>${worked}</strong></div><div class="report-box"><small>Full Leave Days</small><strong>${leave}</strong></div><div class="report-box"><small>Half Leave Days</small><strong>${half}</strong></div><div class="report-box"><small>Total Working</small><strong>${fmt(working)}</strong></div><div class="report-box"><small>Overtime</small><strong>${fmt(ot)}</strong></div>`;reportCard.style.display='block';reportTitle.textContent=new Date(y,m-1,1).toLocaleDateString(undefined,{month:'long',year:'numeric'})+' · '+emp.name;table.innerHTML='<table><thead><tr><th>Date</th><th>Day</th><th>Status</th><th>Check-in</th><th>Lunch</th><th>Check-out</th><th>Working</th><th>OT</th></tr></thead><tbody>'+rows.map(r=>`<tr><td>${r.date}</td><td>${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][r.dow]}</td><td class="${r.status==='Worked'?'status-work':r.status.includes('Leave')?'status-leave':r.status==='Weekend'?'status-weekend':'status-absent'}">${r.status}${r.detail&&r.status.includes('Leave')?`<br><small>${esc(r.detail)}</small>`:''}</td><td>${r.rec?time(r.rec.check_in):'—'}</td><td>${r.rec?fmt(r.rec.lunch_minutes):'—'}</td><td>${r.rec&&r.rec.check_out?time(r.rec.check_out):'—'}</td><td>${r.rec?fmt(r.rec.working_minutes):'—'}</td><td>${r.rec?fmt(r.rec.overtime_minutes):'—'}</td></tr>`).join('')+'</tbody></table>'}catch(e){alert(e.message)}}function exportReport(){if(!attendance.length)return alert('Select an employee and month first.');const emp=employees.find(e=>String(e.id)===String(employee.value));const head=['Date','Employee','Email','Phone','Check-in','Lunch Start','Lunch End','Check-out','Working Minutes','Overtime Minutes'];const body=attendance.map(a=>[a.date,emp.name,emp.email,emp.phone||'',a.check_in,a.lunch_start||'',a.lunch_end||'',a.check_out||'',a.working_minutes,a.overtime_minutes]);const text=[head,...body].map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');const u=URL.createObjectURL(new Blob([text],{type:'text/csv'}));const a=document.createElement('a');a.href=u;a.download=`${emp.name}-${month.value}-attendance.csv`;a.click();URL.revokeObjectURL(u)}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}init();</script></body></html>
