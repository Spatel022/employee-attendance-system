<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Portal</title><link rel="stylesheet" href="/style.css"></head><body><main class="shell"><header class="top"><div><span class="eyebrow">ADMIN PORTAL</span><h1>Attendance Management</h1><p id="sub" class="muted"></p></div><button class="ghost" onclick="logout()">Logout</button></header><section class="stats"><div class="stat"><small>Employees</small><strong id="empCount">—</strong></div><div class="stat"><small>Checked in today</small><strong id="present">—</strong></div><div class="stat"><small>Currently active</small><strong id="active">—</strong></div><div class="stat"><small>Total working today</small><strong id="work">—</strong></div><div class="stat"><small>Total overtime</small><strong id="ot">—</strong></div></section><section class="card"><h2>Employee management</h2><p class="muted">Add employees and activate/deactivate accounts.</p><div class="formgrid"><div><label>Name</label><input id="n" placeholder="Employee name"></div><div><label>Email</label><input id="em" placeholder="employee@email.com"></div><div><label>Password</label><input id="pw" placeholder="Password"></div></div><button onclick="addEmp()" style="margin-top:12px">Add Employee</button><div id="employees" class="tablewrap" style="margin-top:18px"></div></section><section class="card"><div class="row"><div><h2>Attendance report</h2><p class="muted">Filter by month or employee. Admin can edit every attendance record.</p></div><button onclick="csv()">Export CSV</button></div><div class="toolbar" style="margin:16px 0"><div><label>Month</label><input type="month" id="month"></div><div><label>Employee</label><select id="employee"><option value="">All employees</option></select></div><button onclick="loadAttendance()">Apply</button></div><div id="attendance" class="tablewrap"></div></section></main><script src="/common.js"></script><script>if(!token||role!=='admin')location.href='/';let rows=[];async function load(){try{const d=await api('/admin/dashboard');empCount.textContent=d.employees.length;present.textContent=d.attendance.length;active.textContent=d.attendance.filter(x=>!x.check_out).length;work.textContent=fmt(d.attendance.reduce((n,x)=>n+x.working_minutes,0));ot.textContent=fmt(d.attendance.reduce((n,x)=>n+x.overtime_minutes,0));sub.textContent='Live overview · '+new Date().toLocaleDateString();employee.innerHTML='<option value="">All employees</option>'+d.employees.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('');employees.innerHTML='<table><thead><tr><th>Name</th><th>Email</th><th>Status</th><th>Action</th></tr></thead><tbody>'+d.employees.map(e=>`<tr><td>${esc(e.name)}</td><td>${esc(e.email)}</td><td>${e.active?'Active':'Inactive'}</td><td><button onclick="editEmp(${e.id},${JSON.stringify(e.name)},${JSON.stringify(e.email)},${e.active})">Edit</button></td></tr>`).join('')+'</tbody></table>';await loadAttendance()}catch(e){logout()}}async function loadAttendance(){const q=new URLSearchParams();if(month.value)q.set('month',month.value);if(employee.value)q.set('employee_id',employee.value);rows=await api('/admin/attendance?'+q);attendance.innerHTML=rows.length?'<table><thead><tr><th>Date</th><th>Employee</th><th>Check-in</th><th>Lunch</th><th>Check-out</th><th>Working</th><th>OT</th><th></th></tr></thead><tbody>'+rows.map(a=>`<tr><td>${a.date}</td><td>${esc(a.name)}</td><td>${time(a.check_in)}</td><td>${fmt(a.lunch_minutes)}</td><td>${a.check_out?time(a.check_out):'Active'}</td><td>${fmt(a.working_minutes)}</td><td>${fmt(a.overtime_minutes)}</td><td><button onclick="editAtt(${a.id})">Edit</button></td></tr>`).join('')+'</tbody></table>':'<div class="empty">No attendance records found.</div>'}function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function addEmp(){try{await api('/admin/employees',{method:'POST',body:JSON.stringify({name:n.value,email:em.value,password:pw.value})});n.value=em.value=pw.value='';load()}catch(e){alert(e.message)}}async function editEmp(id,name,email,active){const nn=prompt('Employee name',name);if(nn===null)return;const ee=prompt('Employee email',email);if(ee===null)return;const aa=confirm('Press OK for Active, Cancel for Inactive');try{await api('/admin/employees/'+id,{method:'PATCH',body:JSON.stringify({name:nn,email:ee,active:aa})});load()}catch(e){alert(e.message)}}async function editAtt(id){const a=rows.find(x=>x.id===id);if(!a)return;const ci=prompt('Check-in ISO time',a.check_in);if(ci===null)return;const co=prompt('Check-out ISO time (blank = active)',a.check_out||'');if(co===null)return;const ls=prompt('Lunch start ISO time (blank = none)',a.lunch_start||'');if(ls===null)return;const le=prompt('Lunch end ISO time (blank = none)',a.lunch_end||'');if(le===null)return;try{await api('/admin/attendance/'+id,{method:'PATCH',body:JSON.stringify({check_in:ci,check_out:co||null,lunch_start:ls||null,lunch_end:le||null})});loadAttendance()}catch(e){alert(e.message)}}function csv(){if(!rows.length)return alert('No records to export');const head=['Date','Employee','Email','Check-in','Lunch Start','Lunch End','Check-out','Office Minutes','Lunch Minutes','Working Minutes','Overtime Minutes'];const body=rows.map(a=>[a.date,a.name,a.email,a.check_in,a.lunch_start||'',a.lunch_end||'',a.check_out||'',a.office_minutes,a.lunch_minutes,a.working_minutes,a.overtime_minutes]);const text=[head,...body].map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');const blob=new Blob([text],{type:'text/csv'});const u=URL.createObjectURL(blob);const link=document.createElement('a');link.href=u;link.download='attendance-report.csv';link.click();URL.revokeObjectURL(u)}load();setInterval(load,30000)</script></body></html>
