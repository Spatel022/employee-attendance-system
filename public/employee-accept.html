<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linn Point · Accept Invitation</title><link rel="stylesheet" href="/style.css"><style>body{min-height:100vh;display:grid;place-items:center;background:#f6f7fb}.box{width:min(460px,calc(100% - 32px));background:#fff;border:1px solid #eaecf0;border-radius:20px;padding:32px;box-shadow:0 20px 50px rgba(15,23,42,.08)}.logo{display:block;width:180px;max-height:62px;object-fit:contain;margin:0 auto 28px}.box h1{text-align:center;margin-bottom:8px}.box p{text-align:center}.field{margin-top:18px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input{width:100%;box-sizing:border-box}.btn{width:100%;margin-top:22px}.msg{min-height:22px;margin-top:12px;text-align:center;font-size:13px}.success{color:#067647}.error{color:#b42318}</style></head><body><main class="box"><img class="logo" src="https://linnpoint.com/wp-content/uploads/2020/09/Final-LINNPOINT_LOGO-033.webp" alt="Linn Point"><h1>Accept Invitation</h1><p class="muted">Set your password to activate your Linn Point employee account.</p><div class="field"><label>Password</label><input id="password" type="password" minlength="8" placeholder="Minimum 8 characters" autocomplete="new-password"></div><div class="field"><label>Confirm Password</label><input id="confirm" type="password" minlength="8" placeholder="Re-enter your password" autocomplete="new-password"></div><button id="accept" class="btn" type="button">Accept & Activate Account</button><div id="msg" class="msg"></div></main><script src="/common.js"></script><script>const params=new URLSearchParams(location.search),token=params.get('token'),msg=document.getElementById('msg'),btn=document.getElementById('accept');if(!token){btn.disabled=true;msg.className='msg error';msg.textContent='Invalid invitation link.'}btn.addEventListener('click',async()=>{const p=document.getElementById('password').value,c=document.getElementById('confirm').value;if(p.length<8)return msg.textContent='Password must be at least 8 characters.';if(p!==c)return msg.textContent='Passwords do not match.';btn.disabled=true;btn.textContent='Activating...';try{const r=await fetch('/api/employee/accept-invite',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:p})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not activate account');msg.className='msg success';msg.textContent='Account activated successfully. You can now log in.';setTimeout(()=>location.href='/',1200)}catch(e){msg.className='msg error';msg.textContent=e.message;btn.disabled=false;btn.textContent='Accept & Activate Account'}});</script></body></html>
