<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linn Point · Attendance History</title><link rel="stylesheet" href="/style.css"><style>.portal-page .sidebar-logo{display:block;width:175px;max-height:58px;height:auto;object-fit:contain;margin:0 auto 28px}.portal-page .sidebar{padding-top:22px}.portal-page .content-logo{display:none!important}.portal-page .nav a.active{background:#dff3f5;color:#123b52}.portal-page .page-head{align-items:flex-start}@media(max-width:760px){.portal-page .sidebar-logo{width:150px}}</style></head><body class="portal-page"><div class="app-layout"><aside class="sidebar" id="sidebar"><img class="sidebar-logo" src="/logo-dark.svg" alt="Linn Point"><nav class="nav"><a href="/employee.html">🕒 <span>My Attendance</span></a><a href="/employee-work-report.html">📝 <span>Work Report</span></a><a href="/employee-leave.html">📅 <span>Leave</span></a><a href="/employee-monthly.html">📈 <span>Monthly Summary</span></a><a class="active" href="/employee-history.html">📋 <span>Attendance History</span></a></nav><div class="side-bottom"><div class="user-mini"><strong>Employee Portal</strong><span>Attendance & leave</span></div><button class="logout-link" type="button" onclick="logout()">↪ Logout</button></div></aside><main class="content"><div class="content-inner"><header class="page-head"><div><button class="mobile-menu" type="button" onclick="toggleSidebar()">☰</button><span class="eyebrow">LINN POINT · EMPLOYEE PORTAL</span><h1>Attendance History</h1><p class="muted">Review your previous working days.</p></div></header><section class="card"><div class="section-head"><div><h2>Attendance records</h2><p>Check-in, lunch, check-out, working time and overtime.</p></div><div class="toolbar"><div><label>Month</label><input type="month" id="month"></div><button class="ghost" type="button" onclick="load()">Apply</button></div></div><div id="table" class="tablewrap"></div></section></div></main></div><script src="/common.js"></script><script>if(!token||role!=='employee')location.href='/';function toggleSidebar(){sidebar.classList.toggle('open')}async function load(){try{const q=month.value?('?month='+encodeURIComponent(month.value)):'';const data=await api('/employee/attendance'+q);table.innerHTML=data.length?'<table><thead><tr><th>Date</th><th>Check-in</th><th>Lunch</th><th>Check-out</th><th>Working</th><th>OT</th></tr></thead><tbody>'+data.map(a=>`<tr><td>${a.date}</td><td>${time(a.check_in)}</td><td>${fmt(a.lunch_minutes)}</td><td>${a.check_out?time(a.check_out):'<span class="badge live">Active</span>'}</td><td>${fmt(a.working_minutes)}</td><td class="accent">${fmt(a.overtime_minutes)}</td></tr>`).join('')+'</tbody></table>':'<div class="empty">No attendance records found.</div>'}catch(e){alert(e.message)}}load();</script></body></html>
