<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employee Portal</title><link rel="stylesheet" href="/style.css"></head><body><main class="shell"><header class="top"><div><span class="eyebrow">EMPLOYEE PORTAL</span><h1>My Attendance</h1><p id="today" class="muted"></p></div><button class="ghost" onclick="logout()">Logout</button></header><section id="app"></section></main><script src="/common.js"></script><script>if(!token||role!=='employee')location.href='/';async function load(){try{const a=await api('/employee/today');document.getElementById('today').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});document.getElementById('app').innerHTML=a?`<section class="stats"><div class="stat"><small>Check-in</small><strong>${time(a.check_in)}</strong></div><div class="stat"><small>Office duration</small><strong id="office">${fmt(a.office_minutes)}</strong></div><div class="stat"><small>Lunch</small><strong>${fmt(a.lunch_minutes)}</strong></div><div class="stat"><small>Working</small><strong>${fmt(a.working_minutes)}</strong></div><div class="stat"><small>Overtime</small><strong class="accent">${fmt(a.overtime_minutes)}</strong></div></section><section class="card"><div class="row"><div><h2>Today's status</h2><p class="muted">Your check-in time is locked and cannot be changed.</p></div><span class="badge ${a.check_out?'done':'live'}">${a.check_out?'Completed':'Active'}</span></div><div class="timeline"><div><span>Check-in</span><b>${time(a.check_in)}</b></div><div><span>Lunch start</span><b>${a.lunch_start?time(a.lunch_start):'—'}</b></div><div><span>Lunch end</span><b>${a.lunch_end?time(a.lunch_end):'—'}</b></div><div><span>Check-out</span><b>${a.check_out?time(a.check_out):'—'}</b></div></div><div class="actions">${!a.lunch_start&&!a.check_out?'<button onclick="act(\'lunch-start\')">Start Lunch</button>':''}${a.lunch_start&&!a.lunch_end&&!a.check_out?'<button onclick="act(\'lunch-end\')">End Lunch</button>':''}${!a.check_out&&!a.lunch_start?'<button class="danger" onclick="act(\'check-out\')">Check Out</button>':''}${!a.check_out&&a.lunch_end?'<button class="danger" onclick="act(\'check-out\')">Check Out</button>':''}</div></section>`:`<section class="card center"><div class="bigicon">✓</div><h2>Ready to start?</h2><p class="muted">Check in when you actually arrive at the office.</p><button onclick="act('check-in')">Check In</button></section>`}catch(e){logout()}}async function act(x){try{await api('/employee/'+x,{method:'POST'});load()}catch(e){alert(e.message)}}load();setInterval(load,30000)</script></body></html>
