<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linn Point · Employee Dashboard</title><link rel="stylesheet" href="/style.css"><style>
.portal-page{background:#f4f7fb;color:#0f172a}.portal-page .sidebar{background:linear-gradient(180deg,#071321,#0d1d33);width:250px;padding:22px 13px}.portal-page .sidebar-logo{width:165px;max-height:55px;margin:0 auto 28px;object-fit:contain;filter:brightness(0) invert(1)}.portal-page .content{margin-left:250px;width:calc(100% - 250px);padding:30px 42px 60px}.portal-page .content-inner{max-width:1450px;margin:auto}.portal-page .page-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px}.portal-page .page-head h1{font-size:30px;margin:3px 0 5px;font-weight:850;letter-spacing:-.7px}.portal-page .eyebrow{color:#2563eb;font-weight:850;letter-spacing:1.7px}.portal-page .page-head .muted{margin:0;color:#667085}.portal-page .user-mini{background:#162945;border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px}.portal-page .user-mini strong{display:block;color:#fff;font-size:13px}.portal-page .user-mini span{color:#91a4bc;font-size:11px}.portal-page .nav a{border-radius:12px;min-height:44px}.portal-page .nav a.active{background:#dff3f5;color:#123b52;border:1px solid #8ed0df}.dashboard-welcome{background:#fff;border:1px solid #e5eaf1;border-radius:17px;padding:22px 24px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 7px 24px rgba(16,24,40,.05)}.dashboard-welcome h2{margin:0 0 4px;font-size:20px}.dashboard-welcome p{margin:0;color:#667085;font-size:13px}.employee-name{color:#2563eb}.cl-card{background:#fff;border:1px solid #e5eaf1;border-radius:17px;padding:20px 22px;margin-bottom:18px;box-shadow:0 7px 24px rgba(16,24,40,.05)}.cl-card .cl-row{display:flex;justify-content:space-between;align-items:center}.cl-card h2{margin:0 0 5px;font-size:17px}.cl-card p{margin:0;color:#667085;font-size:12px}.cl-value{font-size:25px;font-weight:850;color:#2563eb}.portal-page .stats{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:18px}.portal-page .stat{min-height:118px;border-radius:16px;padding:20px;background:#fff;border:1px solid #e5eaf1;box-shadow:0 7px 24px rgba(16,24,40,.05)}.portal-page .stat strong{font-size:28px}.portal-page .card{border-radius:17px;border:1px solid #e5eaf1;box-shadow:0 7px 24px rgba(16,24,40,.05)}.portal-page .timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.portal-page .timeline>div{background:#f8fafc;border:1px solid #e5eaf1;border-radius:12px;padding:15px}.portal-page .timeline span{display:block;color:#667085;font-size:11px;margin-bottom:6px}.portal-page .timeline b{font-size:16px}.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}.quick-card{background:#fff;border:1px solid #e5eaf1;border-radius:15px;padding:16px;text-decoration:none;color:#0f172a;box-shadow:0 6px 20px rgba(16,24,40,.04)}.quick-card strong{display:block;font-size:13px;margin-bottom:4px}.quick-card span{font-size:11px;color:#667085}.holiday-note{margin-bottom:18px;padding:14px 16px;border-radius:12px;background:#eef4ff;border:1px solid #bfd3ff;color:#1d4ed8}.portal-page .actions button{min-height:42px}.portal-page .danger{background:#dc2626!important}@media(max-width:1000px){.portal-page .content{margin-left:250px;width:calc(100% - 250px);padding:24px}.portal-page .stats{grid-template-columns:repeat(2,1fr)}.quick-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.portal-page .content{margin-left:0;width:100%;padding:18px 14px 40px}.portal-page .sidebar{width:250px}.portal-page .stats,.quick-grid,.portal-page .timeline{grid-template-columns:1fr}.dashboard-welcome{align-items:flex-start;gap:12px;flex-direction:column}}
</style></head><body class="portal-page"><div class="app-layout"><aside class="sidebar" id="sidebar"><img class="sidebar-logo" src="https://linnpoint.com/wp-content/uploads/2020/09/Final-LINNPOINT_LOGO-033.webp" alt="Linn Point"><nav class="nav"><a class="active" href="/employee.html">🕒 <span>My Attendance</span></a><a href="/employee-work-report.html">📝 <span>Work Report</span></a><a href="/employee-leave.html">📅 <span>Leave</span></a><a href="/employee-monthly.html">📈 <span>Monthly Summary</span></a><a href="/employee-cl.html">🏖️ <span>CL Balance</span></a><a href="/employee-history.html">📋 <span>Attendance History</span></a></nav><div class="side-bottom"><div class="user-mini"><strong id="sideName">Employee</strong><span>Attendance & leave</span></div><button class="logout-link" onclick="logout()">↪ Logout</button></div></aside><main class="content"><div class="content-inner"><header class="page-head"><div><button class="mobile-menu" onclick="sidebar.classList.toggle('open')">☰</button><span class="eyebrow">LINN POINT · EMPLOYEE PORTAL</span><h1>My Attendance</h1><p id="today" class="muted"></p></div><button class="ghost" onclick="load()">Refresh</button></header><div id="welcome"></div><div id="holiday"></div><div id="clbox"></div><div class="quick-grid"><a class="quick-card" href="/employee-leave.html"><strong>📅 Request Leave</strong><span>Apply for leave</span></a><a class="quick-card" href="/employee-history.html"><strong>📋 View Attendance</strong><span>Check your history</span></a><a class="quick-card" href="/employee-monthly.html"><strong>📊 Monthly Report</strong><span>View monthly summary</span></a><a class="quick-card" href="/employee-work-report.html"><strong>📝 Work Report</strong><span>Submit work report</span></a></div><div id="app"></div></div></main></div><script src="/common.js"></script><script>if(!token||role!=='employee')location.href='/';const employeeName=localStorage.employeeName||'Employee';sideName.textContent=employeeName;async function load(){try{const [a,h,cl]=await Promise.all([api('/employee/today'),api('/office/holidays'),api('/employee/cl')]);today.textContent=new Date().toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});welcome.innerHTML='<div class="dashboard-welcome"><div><h2>Welcome, <span class="employee-name">'+escName(employeeName)+'</span>!</h2><p>Here is your attendance overview for today.</p></div><span class="badge live">Employee</span></div>';const ds=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()),isSun=new Date(ds+'T00:00:00+05:30').getDay()===0,found=h.holidays.find(x=>x.date===ds);holiday.innerHTML=(isSun||found)?'<div class="holiday-note"><strong>Holiday:</strong> '+(isSun?'Sunday':escName(found.name))+' — if you work today, you will earn <strong>1 CL</strong> after check-out.</div>':'';clbox.innerHTML='<section class="cl-card"><div class="cl-row"><div><h2>CL Balance</h2><p>Compensatory leave earned for Sundays, configured holidays and manual adjustments.</p></div><strong class="cl-value">'+Number(cl.balance||0)+' days</strong></div><div class="actions" style="margin-top:12px"><a class="button" href="/employee-cl.html">View CL details</a></div></section>';app.innerHTML=a?'<section class="stats"><div class="stat"><span class="icon">🕒</span><small>Check-in</small><strong>'+time(a.check_in)+'</strong></div><div class="stat"><span class="icon">🏢</span><small>Office duration</small><strong>'+fmt(a.office_minutes)+'</strong></div><div class="stat"><span class="icon">☕</span><small>Lunch</small><strong>'+fmt(a.lunch_minutes)+'</strong></div><div class="stat"><span class="icon">⏱️</span><small>Working</small><strong>'+fmt(a.working_minutes)+'</strong></div><div class="stat"><span class="icon">⚡</span><small>Overtime</small><strong>'+fmt(a.overtime_minutes)+'</strong></div></section><section class="card"><div class="section-head"><div><h2>Today\'s status</h2><p>Your check-in time is locked after you start work.</p></div><span class="badge '+(a.check_out?'done':'live')+'">'+(a.check_out?'Completed':'Active')+'</span></div><div class="timeline"><div><span>Check-in</span><b>'+time(a.check_in)+'</b></div><div><span>Lunch start</span><b>'+(a.lunch_start?time(a.lunch_start):'—')+'</b></div><div><span>Lunch end</span><b>'+(a.lunch_end?time(a.lunch_end):'—')+'</b></div><div><span>Check-out</span><b>'+(a.check_out?time(a.check_out):'—')+'</b></div></div><div class="actions">'+(!a.lunch_start&&!a.check_out?'<button onclick="act(\'lunch-start\')">Start Lunch</button>':'')+(a.lunch_start&&!a.lunch_end&&!a.check_out?'<button onclick="act(\'lunch-end\')">End Lunch</button>':'')+(!a.check_out?'<button class="danger" onclick="act(\'check-out\')">Check Out</button>':'')+'</div></section>':'<section class="card center"><div class="bigicon">✓</div><h2>Ready to start?</h2><p class="muted">Check in when you actually arrive at the office.</p><button onclick="act(\'check-in\')">Check In</button></section>'}catch(e){alert(e.message)}}function escName(x){return String(x||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}async function act(x){try{await api('/employee/'+x,{method:'POST'});load()}catch(e){alert(e.message)}}load();setInterval(load,30000);</script></body></html>
