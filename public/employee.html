<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linn Point · My Attendance</title><link rel="stylesheet" href="/style.css"><style>.portal-page .sidebar-logo{display:block;width:175px;max-height:58px;height:auto;object-fit:contain;margin:0 auto 28px}.portal-page .sidebar{padding-top:22px}.portal-page .content-logo{display:none!important}.portal-page .nav a.active{background:#dff3f5;color:#123b52}.holiday-note{margin:0 0 18px;padding:14px 16px;border-radius:12px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412}</style></head><body class="portal-page"><div class="app-layout"><aside class="sidebar" id="sidebar"><img class="sidebar-logo" src="https://linnpoint.com/wp-content/uploads/2020/09/Final-LINNPOINT_LOGO-033.webp" alt="Linn Point"><nav class="nav"><a class="active" href="/employee.html">🕒 <span>My Attendance</span></a><a href="/employee-work-report.html">📝 <span>Work Report</span></a><a href="/employee-leave.html">📅 <span>Leave</span></a><a href="/employee-monthly.html">📈 <span>Monthly Summary</span></a><a href="/employee-cl.html">🏖️ <span>CL Balance</span></a><a href="/employee-history.html">📋 <span>Attendance History</span></a></nav><div class="side-bottom"><div class="user-mini"><strong>Employee Portal</strong><span>Attendance & leave</span></div><button class="logout-link" onclick="logout()">↪ Logout</button></div></aside><main class="content"><div class="content-inner"><header class="page-head"><div><button class="mobile-menu" onclick="sidebar.classList.toggle('open')">☰</button><span class="eyebrow">LINN POINT · EMPLOYEE PORTAL</span><h1>My Attendance</h1><p id="today" class="muted"></p></div><button class="ghost" onclick="load()">Refresh</button></header><div id="holiday"></div><div id="clbox"></div><div id="app"></div></div></main></div><script src="/common.js"></script><script>if(!token||role!=='employee')location.href='/';async function load(){try{const [a,h,cl]=await Promise.all([api('/employee/today'),api('/office/holidays'),api('/employee/cl')]);today.textContent=new Date().toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});const ds=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()),isSun=new Date(ds+'T00:00:00+05:30').getDay()===0,found=h.holidays.find(x=>x.date===ds);holiday.innerHTML=(isSun||found)?'<div class="holiday-note"><strong>Holiday:</strong> '+(isSun?'Sunday':String(found.name).replace(/[&<>]/g,''))+' — if you work today, you will earn <strong>1 CL</strong> for this date after check-out.</div>':'';clbox.innerHTML='<section class="card" style="margin-bottom:18px"><div class="section-head"><div><h2>CL Balance</h2><p>Compensatory leave earned for Sundays, configured holidays and manual adjustments.</p></div><strong style="font-size:24px;color:#2563eb">'+Number(cl.balance||0)+' days</strong></div><div class="actions"><a class="button" href="/employee-cl.html">View CL details</a></div></section>';app.innerHTML=a?`<section class="stats"><div class="stat"><span class="icon">🕒</span><small>Check-in</small><strong>${time(a.check_in)}</strong></div><div class="stat"><span class="icon">🏢</span><small>Office duration</small><strong>${fmt(a.office_minutes)}</strong></div><div class="stat"><span class="icon">☕</span><small>Lunch</small><strong>${fmt(a.lunch_minutes)}</strong></div><div class="stat"><span class="icon">⏱️</span><small>Working</small><strong>${fmt(a.working_minutes)}</strong></div><div class="stat"><span class="icon">⚡</span><small>Overtime</small><strong>${fmt(a.overtime_minutes)}</strong></div></section><section class="card"><div class="section-head"><div><h2>Today's status</h2><p>Your check-in time is locked after you start work.</p></div><span class="badge ${a.check_out?'done':'live'}">${a.check_out?'Completed':'Active'}</span></div><div class="timeline"><div><span>Check-in</span><b>${time(a.check_in)}</b></div><div><span>Lunch start</span><b>${a.lunch_start?time(a.lunch_start):'—'}</b></div><div><span>Lunch end</span><b>${a.lunch_end?time(a.lunch_end):'—'}</b></div><div><span>Check-out</span><b>${a.check_out?time(a.check_out):'—'}</b></div></div><div class="actions">${!a.lunch_start&&!a.check_out?'<button onclick="act(\'lunch-start\')">Start Lunch</button>':''}${a.lunch_start&&!a.lunch_end&&!a.check_out?'<button onclick="act(\'lunch-end\')">End Lunch</button>':''}${!a.check_out?'<button class="danger" onclick="act(\'check-out\')">Check Out</button>':''}</div></section>`:`<section class="card center"><div class="bigicon">✓</div><h2>Ready to start?</h2><p class="muted">Check in when you actually arrive at the office.</p><button onclick="act('check-in')">Check In</button></section>`}catch(e){alert(e.message)}}async function act(x){try{await api('/employee/'+x,{method:'POST'});load()}catch(e){alert(e.message)}}load();setInterval(load,30000);</script></body></html>
