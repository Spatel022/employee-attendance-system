<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linn Point · My Attendance</title><link rel="stylesheet" href="/style.css"><style>.portal-page .sidebar-logo{display:block;width:175px;max-height:58px;height:auto;object-fit:contain;margin:0 auto 28px}.portal-page .sidebar{padding-top:22px}.portal-page .content-logo{display:none!important}.portal-page .nav a.active{background:#dff3f5;color:#123b52}.portal-page .page-head{align-items:flex-start}.portal-page .today-card{margin-top:4px}@media(max-width:760px){.portal-page .sidebar-logo{width:150px}}</style></head><body class="portal-page"><div class="app-layout"><aside class="sidebar" id="sidebar"><img class="sidebar-logo" src="https://linnpoint.com/wp-content/uploads/2020/09/Final-LINNPOINT_LOGO-033.webp" alt="Linn Point"><nav class="nav"><a class="active" href="/employee.html">🕒 <span>My Attendance</span></a><a href="/employee-work-report.html">📝 <span>Work Report</span></a><a href="/employee-leave.html">📅 <span>Leave</span></a><a href="/employee-monthly.html">📈 <span>Monthly Summary</span></a><a href="/employee-history.html">📋 <span>Attendance History</span></a></nav><div class="side-bottom"><div class="user-mini"><strong>Employee Portal</strong><span>Attendance & leave</span></div><button class="logout-link" type="button" onclick="logout()">↪ Logout</button></div></aside><main class="content"><div class="content-inner"><header class="page-head"><div><button class="mobile-menu" type="button" onclick="toggleSidebar()">☰</button><span class="eyebrow">LINN POINT · EMPLOYEE PORTAL</span><h1>My Attendance</h1><p id="today" class="muted"></p></div><button class="ghost" type="button" onclick="load()">Refresh</button></header><div id="app"></div></div></main></div><script src="/common.js"></script><script>if(!token||role!=='employee')location.href='/';function toggleSidebar(){sidebar.classList.toggle('open')}async function load(){try{const a=await api('/employee/today');today.textContent=new Date().toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});app.innerHTML=a?`<section class="stats"><div class="stat"><span class="icon">🕒</span><small>Check-in</small><strong>${time(a.check_in)}</strong></div><div class="stat"><span class="icon">🏢</span><small>Office duration</small><strong>${fmt(a.office_minutes)}</strong></div><div class="stat"><span class="icon">☕</span><small>Lunch</small><strong>${fmt(a.lunch_minutes)}</strong></div><div class="stat"><span class="icon">⏱️</span><small>Working</small><strong>${fmt(a.working_minutes)}</strong></div><div class="stat"><span class="icon">⚡</span><small>Overtime</small><strong>${fmt(a.overtime_minutes)}</strong></div></section><section class="card today-card"><div class="section-head"><div><h2>Today's status</h2><p>Your check-in time is locked after you start work.</p></div><span class="badge ${a.check_out?'done':'live'}">${a.check_out?'Completed':'Active'}</span></div><div class="timeline"><div><span>Check-in</span><b>${time(a.check_in)}</b></div><div><span>Lunch start</span><b>${a.lunch_start?time(a.lunch_start):'—'}</b></div><div><span>Lunch end</span><b>${a.lunch_end?time(a.lunch_end):'—'}</b></div><div><span>Check-out</span><b>${a.check_out?time(a.check_out):'—'}</b></div></div><div class="actions">${!a.lunch_start&&!a.check_out?'<button type="button" onclick="act(\'lunch-start\')">Start Lunch</button>':''}${a.lunch_start&&!a.lunch_end&&!a.check_out?'<button type="button" onclick="act(\'lunch-end\')">End Lunch</button>':''}${!a.check_out?'<button class="danger" type="button" onclick="act(\'check-out\')">Check Out</button>':''}</div></section>`:`<section class="card center"><div class="bigicon">✓</div><h2>Ready to start?</h2><p class="muted">Check in when you actually arrive at the office.</p><button type="button" onclick="act('check-in')">Check In</button></section>`}catch(e){if(e.message==='Request failed')logout();else alert(e.message)}}async function act(x){try{await api('/employee/'+x,{method:'POST'});load()}catch(e){alert(e.message)}}load();setInterval(load,30000);</script></body></html>
