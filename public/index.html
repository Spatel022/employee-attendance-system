<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employee Attendance</title><style>body{font-family:Arial,sans-serif;max-width:1000px;margin:30px auto;padding:0 16px;background:#f7f8fa}button,input,select{padding:10px;margin:5px;border:1px solid #ccc;border-radius:7px}button{cursor:pointer}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:20px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.muted{color:#666}</style></head><body><div id="app"></div><script>const app=document.getElementById('app');let token=localStorage.token,role=localStorage.role;const api=async(p,o={})=>{o.headers={...(o.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};if(o.body)o.headers['Content-Type']='application/json';const r=await fetch('/api'+p,o),j=await r.json();if(!r.ok)throw Error(j.error||'Error');return j};const fmt=m=>{m=Math.max(0,Math.round(m||0));return Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m'};function login(){app.innerHTML='<div class="card"><h1>Attendance System</h1><h2>Login</h2><select id="lr"><option value="employee">Employee</option><option value="admin">Admin</option></select><br><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><br><button onclick="doLogin()">Login</button><p class="muted">Only one admin account is supported.</p></div>'}async function doLogin(){try{const r=await api(lr.value==='admin'?'/admin/login':'/employee/login',{method:'POST',body:JSON.stringify({email:email.value,password:pass.value})});token=r.token;role=lr.value;localStorage.token=token;localStorage.role=role;render()}catch(e){alert(e.message)}}function logout(){localStorage.clear();token=null;role=null;login()}async function employee(){const a=await api('/employee/today');app.innerHTML='<div class="card"><button onclick="logout()">Logout</button><h1>Employee Dashboard</h1>'+(a?'<p><b>Check-in:</b> '+new Date(a.check_in).toLocaleTimeString()+'</p><p><b>Office duration:</b> '+fmt(a.office_minutes||((Date.now()-new Date(a.check_in))/60000))+'</p><p><b>Lunch:</b> '+fmt(a.lunch_minutes)+'</p><p><b>Working:</b> '+fmt(a.working_minutes||Math.max(0,(a.office_minutes||((Date.now()-new Date(a.check_in))/60000))-(a.lunch_minutes||0)))+'</p><p><b>Overtime:</b> '+fmt(a.overtime_minutes)+'</p><div class="grid"><button onclick="act(\'lunch-start\')">Start Lunch</button><button onclick="act(\'lunch-end\')">End Lunch</button><button onclick="act(\'check-out\')">Check Out</button></div>':'<button onclick="act(\'check-in\')">Check In</button>')+'</div>';setTimeout(employee,30000)}async function act(x){try{await api('/employee/'+x,{method:'POST'});employee()}catch(e){alert(e.message)}}async function admin(){const d=await api('/admin/dashboard');app.innerHTML='<button onclick="logout()">Logout</button><h1>Admin Dashboard</h1><div class="card"><h3>Add Employee</h3><input id="n" placeholder="Name"><input id="em" placeholder="Email"><input id="pw" placeholder="Password"><button onclick="addEmp()">Add Employee</button></div><div class="card"><h3>Today\'s Attendance</h3>'+d.attendance.map(a=>'<p><b>'+a.name+'</b> — '+new Date(a.check_in).toLocaleTimeString()+' → '+(a.check_out?new Date(a.check_out).toLocaleTimeString():'Active')+' | Working '+fmt(a.working_minutes)+' | OT '+fmt(a.overtime_minutes)+'</p>').join('')+'</div><div class="card"><h3>Employees</h3>'+d.employees.map(e=>'<p>'+e.name+' — '+e.email+' — '+(e.active?'Active':'Inactive')+'</p>').join('')+'</div>';setTimeout(admin,30000)}async function addEmp(){try{await api('/admin/employees',{method:'POST',body:JSON.stringify({name:n.value,email:em.value,password:pw.value})});admin()}catch(e){alert(e.message)}}async function render(){if(!token)return login();try{role==='employee'?await employee():await admin()}catch{logout()}}render();</script></body></html>
