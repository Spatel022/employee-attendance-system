<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attendance System</title><link rel="stylesheet" href="/style.css"></head><body><main class="shell" style="max-width:760px;padding-top:80px"><section class="card center"><span class="eyebrow">OFFICE ATTENDANCE</span><h1>Welcome</h1><p class="muted">Secure attendance management for employees and administrators.</p><div style="max-width:420px;margin:25px auto;text-align:left"><label>Login as</label><select id="lr"><option value="employee">Employee</option><option value="admin">Administrator</option></select><label style="margin-top:12px">Email</label><input id="email" placeholder="Email"><label style="margin-top:12px">Password</label><input id="pass" type="password" placeholder="Password"><button onclick="doLogin()" style="width:100%;margin-top:16px">Login</button></div><p class="muted" style="font-size:12px">One administrator account is supported.</p></section></main><script>async function doLogin(){try{const role=document.getElementById('lr').value;const r=await fetch('/api/'+(role==='admin'?'admin':'employee')+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:pass.value})});const j=await r.json();if(!r.ok)throw Error(j.error||'Login failed');localStorage.token=j.token;localStorage.role=role;location.href=role==='admin'?'/admin':'/employee'}catch(e){alert(e.message)}}</script></body></html>
